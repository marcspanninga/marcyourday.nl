<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('comingSoon', () => ({
      paused: false,
      reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
      timecode: '00:00:00:00',
      elapsed: 0,
      last: null,
      frame: null,

      init() {
        if (!this.reducedMotion) this.start();
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) this.stop();
          else if (!this.paused && !this.reducedMotion) this.start();
        });
      },

      start() {
        this.last = performance.now();
        const tick = (now) => {
          this.elapsed += now - this.last;
          this.last = now;
          this.timecode = this.format(this.elapsed);
          this.frame = requestAnimationFrame(tick);
        };
        this.frame = requestAnimationFrame(tick);
      },

      stop() {
        cancelAnimationFrame(this.frame);
        this.frame = null;
      },

      toggle() {
        this.paused = !this.paused;
        this.paused ? this.stop() : this.start();
      },

      // Tijdcode als uu:mm:ss:frames (25 fps)
      format(ms) {
        const pad = (n) => String(n).padStart(2, '0');
        const total = Math.floor(ms / 40);
        const f = total % 25;
        const s = Math.floor(total / 25);
        return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}:${pad(f)}`;
      },
    }));
  });
</script>
